commit-msg:
  commands:
    lint-commit-message:
      run: deno task commitlint --edit {1}

output:
  - execution_out

post-commit:
  commands:
    say-thanks:
      run: deno run -A ./git_hooks/post_commit.ts

pre-commit:
  commands:
    check-staged-files:
      run: deno task lint-staged

pre-push:
  commands:
    check-types:
      run: deno check -q
    run-linters:
      run: deno task lint
    run-tests:
      run: deno task test
